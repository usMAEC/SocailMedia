            try {
                const response = await fetch("/getSchedule"); // Pauses until the fetch request completes

                const data = await response.json(); // Pauses until the response body is parsed as JSON
                let k = 0;

                    k++;

                    for (var sub_col in val) {

                console.error("Could not get data:", error); // Handle network or parsing errors

            }



            // console.log('index url', query);
            await sleep(Math.floor(Math.random())); // Waits synchronously for 2 seconds

            return new Promise((resolve, reject) => {
                try {
                    // Set default values if fromDate or toDate are not available
                    const fromDate = query.fromDate ? new Date(`${query.fromDate}T00:00:00`) : null;
                    const toDate = query.toDate ? new Date(`${query.toDate}T23:59:59`) : null;
                    const search = query.search;

                    if (search && !fromDate && !toDate) {
                        const limit = query.limit;
                        const offset = query.offset;
                        return resolve(getAppointmentsBySearch(search, limit, offset));
                    }

                    if (query.view === 'year') {
                        return resolve(generateDates(query.year));
                    }



                    // Filter nach Zeitraum
                    const filteredAppointments = appointments.filter(appointment => {
                        const appointmentStart = new Date(appointment.start);
                        const appointmentEnd = new Date(appointment.end);

                        return (
                            (!fromDate || appointmentStart >= fromDate) &&
                            (!toDate || appointmentEnd <= toDate)
                        );
                    });

                    // Falls ein Suchbegriff existiert, zusätzlich nach Titel filtern
                    if (search) {

                    resolve(filteredAppointments);
                } catch (error) {

                }
            });

<script>
    function displayfile(ref) {
        const file = ref.files[0];

        const imagePreview = document.getElementById('imagePreview');
        const videoPreview = document.getElementById('videoPreview');
        const audioPreview = document.getElementById('audioPreview');
        // Reset previous previews
        imagePreview.style.display = 'none';
        imagePreview.setAttribute('src', '#');
        videoPreview.style.display = 'none';
        videoPreview.setAttribute('src', '#');
        audioPreview.style.display = 'none';
        audioPreview.setAttribute('src', '#');

        if (file) {
            const fileType = file.type.split('/')[0]; // Get the general file type (image or video)
            const objectURL = URL.createObjectURL(file); // Create a temporary URL

            if (fileType === 'image') {
                imagePreview.setAttribute('src', objectURL);
                imagePreview.style.display = 'block';
            } else if (fileType === 'video') {
                videoPreview.setAttribute('src', objectURL);
                videoPreview.style.display = 'block';
                videoPreview.load(); // Load the video source
            } else if (fileType === 'audio') {
                audioPreview.setAttribute('src', objectURL);
                audioPreview.style.display = 'block';
                audioPreview.load(); // Load the video source
            }
        }

    }

    function uploadFile(ref) {

        const imagePreview = document.getElementById('imagePreview');
        const videoPreview = document.getElementById('videoPreview');
        const audioPreview = document.getElementById('audioPreview');
        const progressWrapper = document.getElementById('progressWrapper');
        const progressBar = document.getElementById('progressBar');
        const fileName = document.getElementById('fileName');
        // Reset previous previews
        imagePreview.style.display = 'none';
        imagePreview.setAttribute('src', '#');
        videoPreview.style.display = 'none';
        videoPreview.setAttribute('src', '#');
        audioPreview.style.display = 'none';
        audioPreview.setAttribute('src', '#');
        progressWrapper.style.display = 'block';

        var formData = new FormData();
        formData.append('file', getFileData(ref))

        var xhr = new XMLHttpRequest();
        var status = document.getElementById('status');

        // Track the upload progress
        xhr.upload.addEventListener('progress', function (e) {
            if (e.lengthComputable) {
                progressWrapper.style.display = 'block';
                var percentComplete = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = percentComplete + '%';
                progressBar.textContent = percentComplete + '%'; // Optional: display percentage inside bar
                status.textContent = 'Uploading: ' + percentComplete + '%';
            }
        }, false);

        // Handle completion or errors
        xhr.onreadystatechange = function () {
            if (xhr.readyState == 4) {
                if (xhr.status == 200) {
                    debugger

                    progressWrapper.style.display = 'none';
                    resp = JSON.parse(xhr.responseText);
                    fileName.value = resp.filename;
                    if (resp.filetype.includes('image')) {
                        imagePreview.setAttribute('src', "/getFileLink/" + fileName.value);
                        imagePreview.style.display = 'block';
                    } else if (resp.filetype.includes('video')) {
                        videoPreview.setAttribute('src', "/getFileLink/" + fileName.value);
                        videoPreview.style.display = 'block';
                        videoPreview.load(); // Load the video source
                    } else if (resp.filetype.includes('audio')) {
                        audioPreview.setAttribute('src', "/getFileLink/" + fileName.value);
                        audioPreview.style.display = 'block';
                        audioPreview.load(); // Load the video source
                    }
                    //status.textContent = 'Upload complete. Server response: ' + xhr.responseText;
                    progressBar.style.width = '100%';
                } else {
                    status.textContent = 'Upload failed. Status: ' + xhr.status;
                }
            }
        };

        // Send the request
        xhr.open('POST', 'upload', true); // Replace with your backend endpoint
        xhr.send(formData);
    }

    function upload(ref) {
        debugger
        var formData = new FormData();
        formData.append('file', getFileData(ref))


        fetch("/upload", {
            'method': 'POST',
            'body': formData
            //  'contentType': false, // Tell jQuery not to set contentType
            // 'processData': false, // Tell jQuery not to process the data
        }).then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            // Handle the response (e.g., parse JSON)
            //const result = response.json();
            calendarElement.bsCalendar('refresh');
            //console.log('Success:', result);
        });
        return false;
    }

    function getFileData(refElement) {

        //var files = $(refElement).parent().parent().find('#fileInput');

        //return files[0].files[0];
        return refElement.files[0];
    }

    function Schedule(params) {
        const formDataArray = $("#myForm").serializeArray();
        var formData = new FormData();
        for (i in formDataArray) {

            formData.append(formDataArray[i].name, formDataArray[i].value);
        }
        if (params.data.postnow) {
            formData.append('postnow', true);
            today = new Date().toISOString().split('T')[0];
            formData.set('from_date', today);
            formData.set('end_date', today);
        }
        //formData.append('file', getFileData(params.data.ref));
        fetch("/schedule", {
            'method': 'POST',
            'body': formData // The browser sets the Content-Type automatically
        }).then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            params.data.calendarElement.bsCalendar('refresh');
        });
    }
</script>
