{% extends 'base.html' %}
<script>
    function changeValue(val1) {
        alert(val1);
    }
</script>
{% block content %}
<h1>{% block title %} Messages {% endblock %}</h1>
{% for message in messages %}
<div class='message'>
    <h3>{{ message['title'] }}</h3>
    <p>{{ message['content'] }}</p>
</div>
{% endfor %}
<div>
    <form method="post">
        <label for="Schedule_Type">Schedule Type:</label>
        <select name="Schedule_Type" id="Schedule_Type" onchange="changeValue(this);">
            <option value="Daily">Daily</option>
            <option value="Weekly">Weekly</option>
            <option value="Monthly">Monthly</option>
        </select>

        <select name="frequency" id="frequency">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
        </select>

        <label for="scheduletime">Choose Schedule time:</label>
        <input type="" id="scheduletime" name="scheduletime">
        <br>
        <button type="submit">Submit</button>
    </form>
</div>
{% endblock %}
